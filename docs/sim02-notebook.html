      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

: null, "disabled": false, "hide_code": false}, "id": "Hstk", "name": "_"}, {"code": "", "code_hash": "8a5b3a11e335cea6c9fe15826a331c71", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "nWHF", "name": "_"}], "metadata": {"marimo_version": "0.24.2"}, "version": "1"},

#92;\u0026quot;event\u0026#92;\u0026quot;:\u0026#92;\u0026quot;A GROMACS Hot/Cold/Rest thermostat design was drafted.\u0026#92;\u0026quot;,\u0026#92;\u0026quot;evidence\u0026#92;\u0026quot;:\u0026#92;\u0026quot;historical draft\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;date\u0026#92;\u0026quot;:\u0026#92;\u0026quot;2026-09-30\u0026#92;\u0026quot;,\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Method audit\u0026#92;\u0026quot;,\u0026#92;\u0026quot;event\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Static atom groups were rejected as spatial reservoirs for diffusing water.\u0026#92;\u0026quot;,\u0026#92;\u0026quot;evidence\u0026#92;\u0026quot;:\u0026#92;\u0026quot;DECISION-004\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;date\u0026#92;\u0026quot;:\u0026#92;\u0026quot;2026-09-30\u0026#92;\u0026quot;,\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Engine decision\u0026#92;\u0026quot;,\u0026#92;\u0026quot;event\u0026#92;\u0026quot;:\u0026#92;\u0026quot;LAMMPS eHEX was selected for dynamic spatial heat-exchange regions.\u0026#92;\u0026quot;,\u0026#92;\u0026quot;evidence\u0026#92;\u0026quot;:\u0026#92;\u0026quot;DECISION-005\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;date\u0026#92;\u0026quot;:\u0026#92;\u0026quot;2026-09-30\u0026#92;\u0026quot;,\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Temperature decision\u0026#92;\u0026quot;,\u0026#92;\u0026quot;event\u0026#92;\u0026quot;:\u0026#92;\u0026quot;The 400 K validation \u2192 300 K target sequence was approved.\u0026#92;\u0026quot;,\u0026#92;\u0026quot;evidence\u0026#92;\u0026quot;:\u0026#92;\u0026quot;DECISION-006\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;date\u0026#92;\u0026quot;:\u0026#92;\u0026quot;2026-09-30\u0026#92;\u0026quot;,\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Source audit\u0026#92;\u0026quot;,\u0026#92;\u0026quot;event\u0026#92;\u0026quot;:\u0026#92;\u0026quot;The 2016 paper and author package fixed the benchmark g 3' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='true' data-page-size='10' data-selection='\u0026quot;multi\u0026quot;' data-show-filters='false' data-show-download='true' data-show-search='true' data-show-column-summaries='true' data-show-data-types='true' data-show-page-size-selector='true' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ECheckpoint 08's failure remains in the chronology. DECISION-009 adds periodic momentum removal only during thermostat preparation and defines RATTLE after velocity-changing fixes. Stage A passed at 2 ps and 20 ps; the 2 ps Stage-B transition returned to 399.81 K. With periodic correction removed, the four-rank NVE COM speed reached 7.14e-6 \u00c5/fs at 100 fs and the run stopped at 400 fs. The approved one-rank continuation later completed 2 ps with 20 NVE samples and maximum COM 1.04e-18 \u00c5/fs. Stage B was replayed under each rank count, so the phase-space states entering NVE differed. This indicates rank-sensitive continuation behavior but does not identify its cause. The full bridge remains on hold.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "74d224246a11b278f6073053639d6434", "console": [], "id": "Kclp", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"checkpoint-10-one-rank-continuation-diagnostic\"\u003ECheckpoint 10 \u2014 one-rank continuation diagnostic\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe user approved a one-rank replay of Stage B from the same 20 ps\nStage-A restart, followed by 2 ps of uncorrected NVE. The NVE segment\ncompleted 2,000 steps with 20 samples: 392.66\u2013402.38 K, endpoint\n399.70 K, and maximum COM speed \u003Ccode\u003E1.0435e-18 \u00c5/fs\u003C/code\u003E, far below the frozen\n\u003Ccode\u003E1e-6 \u00c5/fs\u003C/code\u003E ceiling.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis differs from the four-rank run, which first exceeded the ceiling\nat 100 fs. Since Stage B was rerun at each rank count, the NVE starting\nstates were not identical. The result indicates rank-sensitive\ncontinuation behavior; it does not isolate an MPI, RATTLE, or NVE cause.\nThe full bridge remains on hold. A same-Stage-B-restart Stage-C/NVE\ncomparison is proposed but not yet approved.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELAMMPS logged completion at step 24,000 and wrote its final restart in\n32:23. A shell-wrapper \u003Ccode\u003Eprintf\u003C/code\u003E error after completion prevented capture\nof the process exit code; the diagnostic report records this limitation.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='Kclp-0' random-id='ea045e3c-779c-4f8b-6c53-bfee3ed3c7f6'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;run\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Checkpoint 09; 4 MPI ranks\u0026#92;\u0026quot;,\u0026#92;\u0026quot;NVE duration\u0026#92;\u0026quot;:\u0026#92;\u0026quot;0.4 ps captured\u0026#92;\u0026quot;,\u0026#92;\u0026quot;samples\u0026#92;\u0026quot;:4,\u0026#92;\u0026quot;first threshold breach\u0026#92;\u0026quot;:\u0026#92;\u0026quot;100 fs; 7.1446e-6 \u00c5/fs\u0026#92;\u0026quot;,\u0026#92;\u0026quot;maximum COM\u0026#92;\u0026quot;:\u0026#92;\u0026quot;8.3573e-6 \u00c5/fs\u0026#92;\u0026quot;,\u0026#92;\u0026quot;outcome\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Ceiling exceeded\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;run\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Checkpoint 10; 1 MPI rank\u0026#92;\u0026quot;,\u0026#92;\u0026quot;NVE duration\u0026#92;\u0026quot;:\u0026#92;\u0026quot;2 ps completed\u0026#92;\u0026quot;,\u0026#92;\u0026quot;samples\u0026#92;\u0026quot;:20,\u0026#92;\u0026quot;first threshold breach\u0026#92;\u0026quot;:\u0026#92;\u0026quot;None\u0026#92;\u0026quot;,\u0026#92;\u0026quot;maximum COM\u0026#92;\u0026quot;:\u0026#92;\u0026quot;1.0435e-18 \u00c5/fs at 1.9 ps\u0026#92;\u0026quot;,\u0026#92;\u0026quot;outcome\u0026#92;\u0026quot;:\u0026#92;\u0026quot;All sampled COM values below ceiling\u0026#92;\u0026quot;}]\u0026quot;' data-total-rows='2' data-total-columns='6' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='10' data-selection='\u0026quot;multi\u0026quot;' data-show-filters='false' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='false' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "726f2f2eef534c5abbd8a5bebb5cd8cf", "console": [], "id": "emfo", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"checkpoint-08-and-09-implementation-failures\"\u003ECheckpoint 08 and 09 implementation failures\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe supplied author file is a steady-state NEMD snapshot. Its\nvelocities must be replaced before it can become the equilibrium\nreference. The source does not report its NpT pressure target, so\nthis bridge preserves the exact published box instead of inventing\none. \u003Cstrong\u003EDECISION-008 approved this protocol. The first integrated\nattempt failed the frozen COM criterion at 2 ps and was stopped.\nDECISION-009 approved a preparation-only correction. Zero-step,\n2 ps Stage-A, 20 ps Stage-A, and 2 ps Stage-B checks passed. The\nfour-rank uncorrected NVE check exceeded the COM ceiling at 100 fs\nand stopped at 400 fs. Checkpoint 10's one-rank NVE comparison\ncompleted 2 ps below the ceiling, but Stage B was replayed at each\nrank count, so the cause is not isolated. The full bridge remains\non hold.\u003C/strong\u003E\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='emfo-0' random-id='191d7ef7-1ccd-df32-773a-c4318bcb1734'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;A\u0026#92;\u0026quot;,\u0026#92;\u0026quot;control\u0026#92;\u0026quot;:\u0026#92;\u0026quot;NVE + direct rescale / 100 fs\u0026#92;\u0026quot;,\u0026#92;\u0026quot;duration\u0026#92;\u0026quot;:\u0026#92;\u0026quot;20 ps\u0026#92;\u0026quot;,\u0026#92;\u0026quot;purpose\u0026#92;\u0026quot;:\u0026#92;\u0026quot;erase inherited NEMD velocities\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;B\u0026#92;\u0026quot;,\u0026#92;\u0026quot;control\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Nos\u00e9\u2013Hoover NVT, 400 K, \u03c4 = 1 ps\u0026#92;\u0026quot;,\u0026#92;\u0026quot;duration\u0026#92;\u0026quot;:\u0026#92;\u0026quot;500 ps\u0026#92;\u0026quot;,\u0026#92;\u0026quot;purpose\u0026#92;\u0026quot;:\u0026#92;\u0026quot;relax PPPM liquid at exact volume\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;C\u0026#92;\u0026quot;,\u0026#92;\u0026quot;control\u0026#92;\u0026quot;:\u0026#92;\u0026quot;exact velocity scale\u0026#92;\u0026quot;,\u0026#92;\u0026quot;duration\u0026#92;\u0026quot;:\u0026#92;\u0026quot;instant\u0026#92;\u0026quot;,\u0026#92;\u0026quot;purpose\u0026#92;\u0026quot;:\u0026#92;\u0026quot;set 400 K before NVE\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;D\u0026#92;\u0026quot;,\u0026#92;\u0026quot;control\u0026#92;\u0026quot;:\u0026#92;\u0026quot;NVE\u0026#92;\u0026quot;,\u0026#92;\u0026quot;duration\u0026#92;\u0026quot;:\u0026#92;\u0026quot;1 ns\u0026#92;\u0026quot;,\u0026#92;\u0026quot;purpose\u0026#92;\u0026quot;:\u0026#92;\u0026quot;measure equilibrium acceptance\u0026#92;\u0026quot;}]\u0026quot;' data-total-rows='4' data-total-columns='4' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='10' data-selection='\u0026quot;multi\u0026quot;' data-show-filters='false' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='false' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EPrimary acceptance tests are frozen before execution: 400 \u00b1 1 K NVE\nmean with block SE \u2264 0.5 K; fitted relative energy drift \u2264 0.005%;\nexact system integrity; bounded geometry errors and no O\u2013O contact\nbelow 2.2 \u00c5; no resolved z-temperature slope; stationary O\u2013O first\npeak and coordination; and COM speed \u2264 1e-6 \u00c5/fs with no systematic\ngrowth. The COM threshold was fixed before step 1 from the measured\nfour-rank RATTLE initialization floor.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "7d2d6090b76ceb6c8bb22204c34b3007", "console": [], "id": "Hstk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"checkpoint-07-release-gates\"\u003ECheckpoint 07 release gates\u003C/h2\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EPASS \u2014 build and zero-step audit:\u003C/strong\u003E count, box, neutrality,\n   geometry, regions, RATTLE, eHEX syntax, and PPPM initialization.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EFAIL \u2014 equilibrium bridge:\u003C/strong\u003E initialization met the COM ceiling, but\n   Stage-A speeds at 1 ps and 2 ps exceeded it by more than 10\u00d7. The run\n   stopped before NVT or NVE; a new momentum-control checkpoint is required.\u003C/li\u003E\n\u003Cli\u003E100 ps eHEX smoke test at 1 fs: energy ledger, occupancy, profile\n   direction, and absence of cavitation.\u003C/li\u003E\n\u003Cli\u003EMatched 1 fs versus 2 fs test from the same prepared state.\u003C/li\u003E\n\u003Cli\u003E1 ns stationarity pilot with unfolded branches and block evolution.\u003C/li\u003E\n\u003Cli\u003EProduction release only when those records justify the allocation;\n   an independent seed is required before a positive reproducibility claim.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EA failed gate is a recorded result. It triggers a documented change and a\nnew pilot; it cannot be silently tuned away.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8a5b3a11e335cea6c9fe15826a331c71", "console": [], "id": "nWHF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"authoritative-records\"\u003EAuthoritative records\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EWorkflow: \u003Ccode\u003EC:\\Users\\WebVajhegan\\Thermal-Polarization\\research\\WORKFLOW.md\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003EEngine decision: \u003Ccode\u003EC:\\Users\\WebVajhegan\\Thermal-Polarization\\research\\decisions\\DECISION-005-SIM-02-LAMMPS-eHEX.md\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003EDesign discussion: \u003Cco
